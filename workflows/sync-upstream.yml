name: Sync from upstream

on:
  schedule:
    - cron: '0 5 * * *'   # Jalan setiap hari jam 05:00 UTC
  workflow_dispatch:      # Biar bisa dijalankan manual

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Fauzan-Developer/CapstoneProject.git
          git fetch upstream
      - name: Merge upstream changes
        run: |
          git checkout main
          git merge upstream/main --allow-unrelated-histories -m "Sync with upstream"
      - name: Push changes
        run: git push origin main
